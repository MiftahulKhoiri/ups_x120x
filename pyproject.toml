[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "x120x-monitor"
version = "0.1.0"
description = "Pemantau UPS HAT X120x (X1200/X1201/X1202) untuk Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["smbus2", "gpiozero"]

[project.optional-dependencies]
gui = ["PyQt5"]
dev = ["pytest"]

[project.scripts]
x120x = "x120x.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
